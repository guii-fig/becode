<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Define a codificação e permite que a página se ajuste ao tamanho da tela. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeCode</title>
    <!-- Carrega primeiro as regras gerais e depois as regras próprias do login. -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body id="home">

    <!-- Apresentação lateral, escondida em telas menores pelo CSS. -->
    <aside id="desktop-welcome">
        <div id="welcome">
            <div id="logo">
                <img src="../assets/logo.png" alt="BeCode">
                <span>BeCode</span>
            </div>
            <div id="welcome-text">
                <h2>Atendimento que gera conexões</h2>
                <p>Catálogo, pedidos sob encomenda, agenda integrada com Google Calendar e atendimento
                inteligente no WhatsApp — em um só lugar.</p>
                <span id="bubbles-box">
                    <div class="bubbles">Agenda</div>
                    <div class="bubbles">Catálogo</div>
                    <div class="bubbles">WhatsApp AI</div>
                </span>
            </div>
            <p id="copy">&copy; 2026 BeCode</p>
        </div>
    </aside>

    <!-- Área dos formulários de login e criação de conta. -->
    <main id="forms-container">
        <div id="forms">
            <h2>Acesse sua conta</h2>
            <p>Gerencie pedidos e agendamentos</p>

            <div id="selection">
                <button id="login" class="select-btn ativo">Login</button>
                <button id="create-account" class="select-btn">Criar Conta</button>
            </div>
            <!-- Campos de acesso: required pede ao navegador que valide o preenchimento. -->
            <form id="form-login" class="form ativo">
                <label for="email-login" class="label-form">Email</label><br>
                <input type="email" name="email-login" id="email-login" placeholder="voce@empresa.com" required><br>
                <label for="password-login" class="label-form">Senha</label><br>
                <input type="password" name="password-login" id="password-login" placeholder="••••••••" required><br>
                <button class="btn-submit" id="btn-login" type="submit">Entrar</button>
            </form>
            <!-- Campos para cadastrar o negócio e a primeira conta de usuário. -->
            <form id="form-create" class="form">
                <label for="bss-name" class="label-form">Nome do negócio</label><br>
                <input type="text" name="bss-name" id="bss-name" placeholder="Barbearia do João" required><br>
                <label for="name" class="label-form">Seu nome</label><br>
                <input type="text" name="name" id="name" placeholder="João da Silva" required><br>
                <label for="email" class="label-form">Email</label><br>
                <input type="email" name="email" id="email" placeholder="voce@empresa.com" required><br>
                <label for="password" class="label-form">Senha</label><br>
                <input type="password" name="password" id="password" placeholder="••••••••" required><br>
                <button class="btn-submit" id="btn-create" type="submit">Criar conta</button>
            </form>
        </div>
    </main>

    <!-- O módulo liga os formulários à lógica de cadastro e autenticação. -->
    <script type="module" src="../js/login.js"></script>
</body>
</html>
